<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <div class="shell">
    <header class="rail">
      <a class="rail__name" href="{{ '/' | relative_url }}">Nika<br>Mansouri Ghiasi</a>
      <p class="rail__role">{{ site.tagline }}</p>

      <nav class="nav" aria-label="Main">
        <ul>
          {% for item in site.nav %}
          <li>
            <a href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.name }}</a>
          </li>
          {% endfor %}
        </ul>
      </nav>

      <ul class="rail__links">
        <li><a href="{{ site.scholar }}">Google Scholar</a></li>
        <li><a href="https://safari.ethz.ch/">SAFARI Research Group</a></li>
        <li class="rail__mail">{{ site.email }}</li>
      </ul>
    </header>

    <main id="main" class="content">
      {{ content }}
    </main>
  </div>
</body>
</html>
