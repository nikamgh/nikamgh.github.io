<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="profile">
  <meta property="og:image" content="{{ '/assets/img/nika.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <nav class="navbar" aria-label="Main">
    <div class="navbar__inner">
      <a class="navbar__brand" href="{{ '/' | relative_url }}">Nika Mansouri Ghiasi</a>

      <button class="navbar__toggle" aria-expanded="false" aria-controls="navmenu">
        <span class="navbar__bars" aria-hidden="true"></span>
        <span class="sr-only">Menu</span>
      </button>

      <ul class="navbar__menu" id="navmenu">
        {% for item in site.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}class="is-active" aria-current="page"{% endif %}>{{ item.name }}</a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </nav>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }} &middot; {{ site.role }}, {{ site.org }}</p>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
